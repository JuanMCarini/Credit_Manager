version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: credit_manager_db_dev
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-credit_manager}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: credit_manager_backend_dev
    restart: always
    ports:
      - "8000:8000"
    volumes:
      # Sincroniza la carpeta local src y data con el contenedor
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    # Comando sobreescrito para correr Uvicorn con auto-reload
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build # Apuntamos a la etapa con Node.js en vez de Nginx
    container_name: credit_manager_frontend_dev
    restart: always
    ports:
      # El frontend en dev expone el puerto 5173 por defecto en Vite
      - "5173:5173"
    volumes:
      # Sincroniza la carpeta local de frontend
      - ./frontend:/app
      # Volumen anónimo para evitar que la carpeta local sobrescriba las dependencias compiladas de node_modules
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    # Comando sobreescrito para levantar el servidor de desarrollo de Vite
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
